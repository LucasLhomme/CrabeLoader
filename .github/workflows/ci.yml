name: CI - Build & Test

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCRABELOADER_AS_SHARED=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build CrabeLoader
        run: |
          cmake --build build --config Release

      - name: Verify Artifacts
        shell: bash
        run: |
          if [ -f build/Release/bink2w32.dll ] || [ -f build/bink2w32.dll ]; then
            echo "Build successful: bink2w32.dll found."
          else
            echo "Error: bink2w32.dll not produced."
            exit 1
          fi
