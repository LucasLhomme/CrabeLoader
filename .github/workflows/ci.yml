name: CI - Build & Test

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check file headers
        run: |
          python tools/check_headers.py

      - name: Configure CMake
        run: |
          cmake -B build -S . -A Win32 -DCRABELOADER_AS_SHARED=ON -DCRABELOADER_BUILD_INSTALLER=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build CrabeLoader
        run: |
          cmake --build build --config Release

      - name: Verify Artifacts
        shell: bash
        run: |
          if [ -f build/Release/bink2w32.dll ] || [ -f build/bink2w32.dll ]; then
            echo "Build successful: bink2w32.dll found."
          else
            echo "Error: bink2w32.dll not produced."
            exit 1
          fi
          if [ ! -f build/Release/CrabeInstaller.exe ]; then
            echo "Error: CrabeInstaller.exe not produced."
            exit 1
          fi

      - name: Run VFS Override Tests
        run: |
          .\build\Release\test_vfs_override.exe

      - name: Run Draw Primitives & Pad Tests
        run: |
          .\build\Release\test_draw_primitives.exe

      - name: Run CRABE-FATE Regression Suite
        run: |
          .\build\Release\crabe_fate.exe

      - name: Run Update Check Tests
        run: |
          .\build\Release\test_update_checker.exe

      - name: Run Installer Tests
        run: |
          .\build\Release\test_installer.exe

      - name: Run Lua API Suite
        run: |
          python tests/run_lua_tests.py
